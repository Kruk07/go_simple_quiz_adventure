<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quiz Adventure Test Client</title>
    <script src="/i18n/en.js"></script>
    <script src="/i18n/pl.js"></script>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.88);
            --border: #dfe7f3;
            --text: #162033;
            --muted: #54627a;
            --primary: #3b82f6;
            --primary-strong: #1d4ed8;
            --success: #0f766e;
            --warning: #b45309;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 100%);
            color: var(--text);
        }

        body {
            padding: max(16px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.7rem, 4vw, 2.3rem);
            text-align: center;
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 1.15rem;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--muted);
        }

        input {
            width: 100%;
            min-height: 48px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
            background: rgba(255,255,255,0.75);
        }

        button {
            appearance: none;
            border: none;
            border-radius: 12px;
            padding: 12px 14px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 48px;
            touch-action: manipulation;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .row.stacked {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }

        .option-button {
            flex: 1 1 calc(50% - 8px);
            min-width: 120px;
            min-height: 54px;
            font-size: 0.98rem;
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text);
            border: 1px solid var(--border);
        }

        #log {
            min-height: 150px;
            max-height: 260px;
            overflow: auto;
            white-space: pre-wrap;
            padding: 12px;
            border-radius: 12px;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.5;
            font-size: 0.92rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary-strong);
            font-weight: 700;
        }

        .summary {
            margin: 0 0 10px;
            color: var(--muted);
        }

        ul {
            margin: 8px 0 0 18px;
            padding: 0;
        }

        li {
            margin-bottom: 6px;
        }

        .panel-wide {
            grid-column: 1 / -1;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .option-button {
                flex: 1 1 100%;
            }

            .row {
                display: grid;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Quiz Adventure</h1>
    <div class="grid">
        <div class="panel">
            <h2>Connection</h2>
            <div class="field">
                <label for="room-code">Room Code</label>
                <input id="room-code" placeholder="Room Code" />
            </div>
            <div class="field">
                <label for="nickname">Nickname</label>
                <input id="nickname" placeholder="Nickname" />
            </div>
            <div class="field">
                <label for="language">Language</label>
                <select id="language" style="width: 100%; min-height: 48px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 1rem; background: rgba(255,255,255,0.75);">
                    <option value="en">English</option>
                    <option value="pl">Polski</option>
                </select>
            </div>
            <div class="row stacked">
                <button id="create-room">Create Room</button>
                <button id="copy-room" style="background: linear-gradient(180deg, #0f766e 0%, #115e59 100%);">Copy Code</button>
                <button id="join-room">Join Room</button>
                <button id="start-game" style="background: linear-gradient(180deg, #eab308 0%, #b45309 100%);">Start Game</button>
                <button id="restart-game" style="background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%); display: none;">Restart Game</button>
                <button id="leave-room" style="background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);">Leave Room</button>
            </div>
            <div class="field">
                <p class="summary"><span class="badge" id="status">Not connected</span></p>
                <p class="summary" id="room-info">No room selected</p>
            </div>
        </div>

        <div class="panel">
            <h2>Current Game</h2>
            <div id="game-state">No game yet.</div>
        </div>

        <div id="category-panel" class="panel" style="display: none;">
            <h2>Category Voting</h2>
            <div id="category-buttons" class="row"></div>
        </div>

        <div id="answer-panel" class="panel" style="display: none;">
            <h2>Answer Submission</h2>
            <div id="answer-buttons" class="row"></div>
        </div>

        <div class="panel panel-wide">
            <h2>Event Log</h2>
            <div id="log">Ready.</div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const roomInfoEl = document.getElementById('room-info');
        const gameStateEl = document.getElementById('game-state');
        const logEl = document.getElementById('log');
        const categoryButtonsEl = document.getElementById('category-buttons');
        const answerButtonsEl = document.getElementById('answer-buttons');
        const categoryPanelEl = document.getElementById('category-panel');
        const answerPanelEl = document.getElementById('answer-panel');
        const restartGameBtn = document.getElementById('restart-game');
        const leaveRoomBtn = document.getElementById('leave-room');
        const languageSelectEl = document.getElementById('language');

        const uiText = {
            en: {
                title: 'Quiz Adventure',
                connection: 'Connection',
                roomCode: 'Room Code',
                nickname: 'Nickname',
                createRoom: 'Create Room',
                copyCode: 'Copy Code',
                joinRoom: 'Join Room',
                startGame: 'Start Game',
                restartGame: 'Restart Game',
                leaveRoom: 'Leave Room',
                notConnected: 'Not connected',
                noRoomSelected: 'No room selected',
                currentGame: 'Current Game',
                noGameYet: 'No game yet.',
                categoryVoting: 'Category Voting',
                answerSubmission: 'Answer Submission',
                eventLog: 'Event Log',
                ready: 'Ready.',
                languageLabel: 'Language',
                waitingForCategoryVoting: 'Waiting for category voting...',
                connectFirst: 'Connect first',
                roomAndNicknameRequired: 'roomCode and nickname required',
                cannotVote: 'Cannot vote: not connected',
                cannotAnswer: 'Cannot answer: wait for question',
                noRoomToLeave: 'Not connected to a room',
                leftTheRoom: 'Left the room',
                lobby: 'Lobby',
                players: 'Players:',
                selectOneOfCategories: 'Select one of the categories below:',
                categoryVotingStarted: 'Category voting started',
                answerWithButtons: 'Answer with buttons below.',
                question: 'Question',
                summary: 'Summary',
                winner: 'Winner:',
                correctAnswer: 'Correct answer:',
                gameOver: 'Game Over',
                room: 'Room',
                connected: 'Connected',
                disconnected: 'Disconnected',
                category: 'Category',
                round: 'Round',
                questionsAnswered: 'Questions answered:',
                roomReady: 'Room ready',
                connectedToRoom: 'Connected to room',
                createdRoom: 'Created room',
                noRoomCode: 'No room code to copy',
                copiedRoomCode: 'Copied room code',
                copyFailed: 'Copy failed:',
                websocketError: 'WebSocket error:',
                webSocketNotConnected: 'WebSocket not connected',
                serverEvent: 'Server event:'
            },
            pl: {
                title: 'Quiz Adventure',
                connection: 'Połączenie',
                roomCode: 'Kod pokoju',
                nickname: 'Nick',
                createRoom: 'Utwórz pokój',
                copyCode: 'Kopiuj kod',
                joinRoom: 'Dołącz',
                startGame: 'Rozpocznij grę',
                restartGame: 'Zagraj ponownie',
                leaveRoom: 'Opuść pokój',
                notConnected: 'Nie połączono',
                noRoomSelected: 'Nie wybrano pokoju',
                currentGame: 'Aktualna gra',
                noGameYet: 'Brak gry.',
                categoryVoting: 'Głosowanie kategorii',
                answerSubmission: 'Odpowiedzi',
                eventLog: 'Log zdarzeń',
                ready: 'Gotowe.',
                languageLabel: 'Język',
                waitingForCategoryVoting: 'Czekanie na głosowanie kategorii...',
                connectFirst: 'Najpierw połącz się',
                roomAndNicknameRequired: 'kod pokoju i nick są wymagane',
                cannotVote: 'Nie można głosować: brak połączenia',
                cannotAnswer: 'Nie można odpowiedzieć: zaczekaj na pytanie',
                noRoomToLeave: 'Brak połączenia z pokojem',
                leftTheRoom: 'Opuszczono pokój',
                lobby: 'Lobby',
                players: 'Gracze:',
                selectOneOfCategories: 'Wybierz jedną z kategorii poniżej:',
                categoryVotingStarted: 'Rozpoczęto głosowanie kategorii',
                answerWithButtons: 'Odpowiedz przyciskami poniżej.',
                question: 'Pytanie',
                summary: 'Podsumowanie',
                winner: 'Zwycięzca:',
                correctAnswer: 'Poprawna odpowiedź:',
                gameOver: 'Koniec gry',
                room: 'Pokój',
                connected: 'Połączono',
                disconnected: 'Rozłączono',
                category: 'Kategoria',
                round: 'Runda',
                questionsAnswered: 'Odpowiedziano pytań:',
                roomReady: 'Pokój gotowy',
                connectedToRoom: 'Połączono z pokojem',
                createdRoom: 'Utworzono pokój',
                noRoomCode: 'Brak kodu pokoju do skopiowania',
                copiedRoomCode: 'Skopiowano kod pokoju',
                copyFailed: 'Kopiowanie nie powiodło się:',
                websocketError: 'Błąd WebSocket:',
                webSocketNotConnected: 'WebSocket nie jest podłączony',
                serverEvent: 'Zdarzenie serwera:'
            }
        };

        const localeData = window.quizLocaleData || {
            en: { categories: {}, questions: {} },
            pl: { categories: {}, questions: {} }
        };

        function getTranslationsForCurrentLanguage() {
            return localeData[currentLanguage] || { categories: {}, questions: {} };
        }

        function getCategoryLabel(category) {
            if (!category) return '';
            const categoryKey = category.id || category;
            const translations = getTranslationsForCurrentLanguage().categories || {};
            return translations[categoryKey] || category.name || category;
        }

        function translateQuestionPayload(payload) {
            const questionKey = payload.questionId || payload.id;
            const translations = getTranslationsForCurrentLanguage().questions || {};
            const translation = translations[questionKey];
            if (!translation) {
                return payload;
            }
            return {
                ...payload,
                text: translation.text || payload.text,
                options: translation.options || payload.options,
                correctAnswer: translation.correctOption || payload.correctAnswer,
                category: payload.category || payload.categoryName
            };
        }

        let socket = null;
        let currentQuestionId = '';
        let categoryOptions = [];
        let currentLanguage = 'en';

        function getSocketUrl(roomCode, nickname) {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const params = new URLSearchParams();
            if (roomCode) params.set('roomCode', roomCode);
            if (nickname) params.set('nickname', nickname);
            params.set('lang', currentLanguage);
            const queryString = params.toString();
            return `${wsProtocol}://${window.location.host}/join-room${queryString ? `?${queryString}` : ''}`;
        }

        function seedFromQueryString() {
            const params = new URLSearchParams(window.location.search);
            const roomCode = params.get('roomCode');
            const nickname = params.get('nickname');
            if (roomCode) document.getElementById('room-code').value = roomCode;
            if (nickname) document.getElementById('nickname').value = nickname;
        }

        function t(key) {
            return (uiText[currentLanguage] && uiText[currentLanguage][key]) || uiText.en[key] || key;
        }

        function applyLanguage() {
            document.title = t('title');
            document.querySelector('h1').textContent = t('title');
            document.querySelector('.panel h2').textContent = t('connection');
            document.querySelectorAll('.panel h2')[1].textContent = t('currentGame');
            document.querySelectorAll('.panel h2')[2].textContent = t('categoryVoting');
            document.querySelectorAll('.panel h2')[3].textContent = t('answerSubmission');
            document.querySelectorAll('.panel h2')[4].textContent = t('eventLog');
            document.querySelector('label[for="room-code"]').textContent = t('roomCode');
            document.querySelector('label[for="nickname"]').textContent = t('nickname');
            document.querySelector('label[for="language"]').textContent = t('languageLabel') || 'Language';
            document.getElementById('room-code').placeholder = t('roomCode');
            document.getElementById('nickname').placeholder = t('nickname');
            document.getElementById('create-room').textContent = t('createRoom');
            document.getElementById('copy-room').textContent = t('copyCode');
            document.getElementById('join-room').textContent = t('joinRoom');
            document.getElementById('start-game').textContent = t('startGame');
            document.getElementById('restart-game').textContent = t('restartGame');
            document.getElementById('leave-room').textContent = t('leaveRoom');
            statusEl.textContent = currentLanguage === 'pl' ? 'Nie połączono' : 'Not connected';
            roomInfoEl.textContent = roomInfoEl.textContent || t('noRoomSelected');
            if (categoryOptions.length) {
                renderCategoryButtons();
            }
            if (currentQuestionId) {
                const current = { questionId: currentQuestionId };
                const translated = translateQuestionPayload(current);
                if (translated && translated.text) {
                    renderGameState(document.getElementById('game-state').innerHTML);
                }
            }
        }

        function appendLog(message) {
            logEl.textContent += '\n' + message;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(message) {
            statusEl.textContent = message;
            const tone = message.toLowerCase().includes('connected') ? '#0f766e' : '#1d4ed8';
            statusEl.style.background = tone === '#0f766e' ? 'rgba(15, 118, 110, 0.12)' : 'rgba(59, 130, 246, 0.12)';
            statusEl.style.color = tone === '#0f766e' ? '#0f766e' : '#1d4ed8';
        }

        function setRoomInfo(message) {
            roomInfoEl.textContent = message;
        }

        function renderGameState(content) {
            gameStateEl.innerHTML = content;
        }

        function createButton(text, handler) {
            const button = document.createElement('button');
            button.textContent = text;
            button.className = 'option-button';
            button.onclick = handler;
            return button;
        }

        function showPanel(panel, visible) {
            panel.style.display = visible ? '' : 'none';
        }

        function showRestartButton(visible) {
            restartGameBtn.style.display = visible ? '' : 'none';
        }

        function renderCategoryButtons() {
            categoryButtonsEl.innerHTML = '';
            if (categoryOptions.length === 0) {
                categoryButtonsEl.textContent = t('waitingForCategoryVoting');
                return;
            }
            categoryOptions.forEach((option, index) => {
                const label = String.fromCharCode(65 + index);
                const categoryName = getCategoryLabel(option);
                const button = createButton(`${label}: ${categoryName}`, () => {
                    if (!socket || socket.readyState !== WebSocket.OPEN) {
                        appendLog(t('cannotVote'));
                        return;
                    }
                    sendEvent('VOTE_CATEGORY', { categoryId: option.id });
                    appendLog(`Voted for ${label} (${option.name})`);
                });
                categoryButtonsEl.appendChild(button);
            });
        }

        function renderAnswerButtons() {
            answerButtonsEl.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const label = String.fromCharCode(65 + i);
                const button = createButton(label, () => {
                    if (!socket || socket.readyState !== WebSocket.OPEN || !currentQuestionId) {
                        appendLog(t('cannotAnswer'));
                        return;
                    }
                    sendEvent('SUBMIT_ANSWER', { questionId: currentQuestionId, answer: label });
                    appendLog(`Submitted answer ${label}`);
                });
                answerButtonsEl.appendChild(button);
            }
        }

        function sendEvent(type, payload) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendLog('WebSocket not connected');
                return;
            }
            socket.send(JSON.stringify({ type, payload }));
        }

        document.getElementById('create-room').onclick = async () => {
            try {
                const res = await fetch('/create-room');
                const body = await res.json();
                document.getElementById('room-code').value = body.roomCode;
                appendLog(`${t('createdRoom')} ${body.roomCode}`);
                setRoomInfo(`${t('room')} ${body.roomCode} ${t('roomReady')}`);
            } catch (err) {
                appendLog(t('copyFailed') + ' ' + err.message);
            }
        };

        document.getElementById('copy-room').onclick = async () => {
            const value = document.getElementById('room-code').value.trim();
            if (!value) {
                appendLog(t('noRoomCode'));
                return;
            }
            try {
                await navigator.clipboard.writeText(value);
                appendLog(`${t('copiedRoomCode')} ${value}`);
            } catch (err) {
                appendLog(`${t('copyFailed')} ${err.message}`);
            }
        };

        document.getElementById('join-room').onclick = () => {
            const roomCode = document.getElementById('room-code').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            if (!roomCode || !nickname) {
                appendLog(t('roomAndNicknameRequired'));
                return;
            }
            const url = getSocketUrl(roomCode, nickname);
            socket = new WebSocket(url);

            socket.onopen = () => {
                setStatus(t('connected'));
                setRoomInfo(`${t('room')} ${roomCode} • ${nickname}`);
                appendLog(`${t('connectedToRoom')} ${roomCode}`);
            };

            socket.onmessage = event => {
                const message = JSON.parse(event.data);
                handleServerEvent(message);
            };

            socket.onclose = () => {
                setStatus(t('disconnected'));
                appendLog('WebSocket closed');
            };

            socket.onerror = e => {
                appendLog(`${t('websocketError')} ${e.message || 'unknown'}`);
            };
        };

        document.getElementById('start-game').onclick = () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendLog(t('connectFirst'));
                return;
            }
            sendEvent('START_GAME', {});
            appendLog('START_GAME sent');
        };

        restartGameBtn.onclick = () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendLog(t('connectFirst'));
                return;
            }
            sendEvent('RESTART_GAME', {});
            appendLog('RESTART_GAME sent');
        };

        leaveRoomBtn.onclick = () => {
            if (!socket) {
                appendLog(t('noRoomToLeave'));
                return;
            }
            if (socket.readyState === WebSocket.OPEN) {
                sendEvent('LEAVE_ROOM', {});
            }
            socket.close();
            socket = null;
            showRestartButton(false);
            resetPanels();
            setStatus(t('notConnected'));
            setRoomInfo(t('noRoomSelected'));
            renderGameState(t('noGameYet'));
            appendLog(t('leftTheRoom'));
        };

        function resetPanels() {
            showPanel(categoryPanelEl, false);
            showPanel(answerPanelEl, false);
            showRestartButton(false);
        }

        function handleServerEvent(message) {
            appendLog(`${t('serverEvent')} ${message.type}`);

            switch (message.type) {
                case 'LOBBY_UPDATE':
                    renderLobby(message.payload);
                    resetPanels();
                    break;
                case 'CATEGORY_VOTE_START':
                    categoryOptions = message.payload.categories || [];
                    showPanel(categoryPanelEl, true);
                    showPanel(answerPanelEl, false);
                    renderCategoryButtons();
                    renderGameState(`<p class="summary">${t('categoryVotingStarted')}</p><p>${t('selectOneOfCategories')}</p>`);
                    break;
                case 'QUESTION_START':
                    currentQuestionId = message.payload.questionId;
                    showPanel(categoryPanelEl, false);
                    showPanel(answerPanelEl, true);
                    renderQuestion(message.payload);
                    break;
                case 'QUESTION_RESULT':
                    currentQuestionId = '';
                    showPanel(answerPanelEl, false);
                    renderQuestionResult(message.payload);
                    break;
                case 'ROUND_SUMMARY':
                    currentQuestionId = '';
                    showPanel(answerPanelEl, false);
                    renderRoundSummary(message.payload);
                    break;
                case 'GAME_OVER':
                    currentQuestionId = '';
                    showPanel(categoryPanelEl, false);
                    showPanel(answerPanelEl, false);
                    showRestartButton(true);
                    renderGameOver(message.payload);
                    break;
                default:
                    appendLog('Unhandled event: ' + message.type);
            }
        }

        function renderLobby(payload) {
            const players = payload.players.map(p => `${p.nickname}${p.isHost ? ' (host)' : ''}${p.connected ? '' : ' [disconnected]'}`);
            renderGameState(`<p class="summary">${t('lobby')}</p><p>${t('players')}</p><ul>${players.map(p => `<li>${p}</li>`).join('')}</ul>`);
        }

        function renderQuestion(payload) {
            const translated = translateQuestionPayload(payload);
            const options = ['A', 'B', 'C', 'D'].map(letter => {
                return `<li><strong>${letter}</strong>: ${translated.options[letter] || ''}</li>`;
            }).join('');
            renderGameState(`
                <p class="summary">${t('question')} ${translated.questionIndex || payload.questionIndex} / ${payload.totalQuestions}</p>
                <p><strong>${translated.text || payload.text}</strong></p>
                <ul>${options}</ul>
                <p>${t('answerWithButtons')}</p>
            `);
        }

        function renderQuestionResult(payload) {
            const rows = payload.leaderboard.map(entry => `<li>${entry.nickname}: ${entry.score} (+${entry.gained})</li>`).join('');
            renderGameState(`
                <p class="summary">Question Result</p>
                <p>${t('correctAnswer')} <strong>${payload.correctAnswer}</strong></p>
                <ul>${rows}</ul>
            `);
        }

        function renderRoundSummary(payload) {
            const rows = payload.leaderboard.map(entry => `<li>${entry.nickname}: ${entry.score}</li>`).join('');
            renderGameState(`
                <p class="summary">Round ${payload.round} Summary</p>
                <p>${t('category')}: <strong>${payload.category}</strong></p>
                <p>${t('questionsAnswered')} ${payload.questionsAnswered}/${payload.totalQuestions}</p>
                <ul>${rows}</ul>
            `);
        }

        function renderGameOver(payload) {
            const rows = payload.leaderboard.map(entry => `<li>${entry.nickname}: ${entry.score}</li>`).join('');
            renderGameState(`
                <p class="summary">${t('gameOver')}</p>
                <p>${t('winner')} <strong>${payload.winner}</strong></p>
                <ul>${rows}</ul>
            `);
        }

        languageSelectEl.addEventListener('change', (event) => {
            currentLanguage = event.target.value;
            localStorage.setItem('quiz-language', currentLanguage);
            applyLanguage();
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
                socket = null;
                const roomCode = document.getElementById('room-code').value.trim();
                const nickname = document.getElementById('nickname').value.trim();
                if (roomCode && nickname) {
                    document.getElementById('join-room').click();
                }
            }
        });

        resetPanels();
        renderAnswerButtons();
        seedFromQueryString();
        const storedLang = localStorage.getItem('quiz-language') || 'en';
        currentLanguage = storedLang === 'pl' ? 'pl' : 'en';
        languageSelectEl.value = currentLanguage;
        applyLanguage();
    </script>
</body>
</html>
